<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1-4-24 Pot Tracker</title>
<meta name="description" content="Track the pot and who owes what while you play 1-4-24 with real dice.">
<style>
  :root {
    --felt: #0f5132;
    --felt-dark: #0a3b24;
    --ink: #f4f1e8;
    --muted: #b9c9bd;
    --gold: #f2c14e;
    --red: #e05a47;
    --green: #a6f0b8;
    --panel: rgba(0, 0, 0, .25);
    --line: rgba(255, 255, 255, .1);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  html { background: var(--felt-dark); }
  body {
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: var(--felt-dark) radial-gradient(ellipse at top, var(--felt) 0%, var(--felt-dark) 70%) no-repeat;
    min-height: 100vh;
  }
  main { max-width: 720px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 16px; }
  .panel { background: var(--panel); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
  button {
    font: inherit; cursor: pointer; border: 0; border-radius: 8px;
    padding: 10px 14px; background: var(--gold); color: #2a1d00; font-weight: 600;
  }
  button.secondary { background: rgba(255,255,255,.15); color: var(--ink); }
  button.danger { background: var(--red); color: #fff; }
  button.link { background: none; color: var(--muted); padding: 4px 8px; font-weight: 400; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  input[type=text], input[type=number] {
    font: inherit; padding: 9px 12px; border-radius: 8px; border: 0; min-width: 0;
  }
  input[type=text] { flex: 1; }
  input[type=number] { width: 70px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .spacer { flex: 1; }
  label { color: var(--muted); }

  /* Pot */
  .pot { text-align: center; }
  .pot .label { color: var(--muted); text-transform: uppercase; letter-spacing: 1px; font-size: .85rem; }
  .pot .amt { font-size: 3.2rem; font-weight: 800; color: var(--gold); line-height: 1.1; }
  .pot .note { color: var(--muted); min-height: 1.4em; }
  .pot .row { justify-content: center; margin-top: 12px; }

  /* Players */
  .player { border-top: 1px solid var(--line); padding: 12px 0; }
  .player:first-of-type { border-top: 0; padding-top: 0; }
  .player .top { display: flex; align-items: baseline; gap: 8px; }
  .player .name { font-weight: 700; font-size: 1.1rem; }
  .player .net { margin-left: auto; font-weight: 700; font-variant-numeric: tabular-nums; font-size: 1.1rem; }
  .player .detail { color: var(--muted); font-size: .85rem; margin: 2px 0 8px; }
  .player .row button { flex: 1; min-width: 120px; }
  .neg { color: #ffb4a8; }
  .pos { color: var(--green); }
  .even { color: var(--muted); }

  /* Settle up */
  .settle li { margin-bottom: 4px; }
  .settle .amt { font-weight: 700; color: var(--gold); }
  .empty { color: var(--muted); }

  .log { max-height: 240px; overflow-y: auto; font-size: .9rem; color: var(--muted); margin: 0; padding-left: 30px; }
  .log li { margin-bottom: 2px; }
  .hidden { display: none !important; }

  .toast {
    position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
    background: #222; color: #fff; padding: 10px 16px; border-radius: 8px; font-size: .95rem;
    box-shadow: 0 4px 14px rgba(0,0,0,.4); opacity: 0; transition: opacity .2s; pointer-events: none;
    max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>🎲 1-4-24 Pot Tracker</h1>
  <p class="sub">Roll the real dice. This keeps track of the pot and who owes what.</p>

  <!-- Pot -->
  <section class="panel pot">
    <div class="label">Pot</div>
    <div class="amt" id="pot">$0</div>
    <div class="note" id="pot-note"></div>
    <div class="row">
      <button id="ante">New round: everyone antes</button>
      <button id="carry" class="secondary">Tie / no winner: carry pot</button>
    </div>
  </section>

  <!-- Players -->
  <section class="panel">
    <h2>Players</h2>
    <div id="players"></div>
    <form class="row" id="add-form" style="margin-top:12px">
      <input type="text" id="new-name" placeholder="Add a player…" maxlength="20" autocomplete="off">
      <button type="submit" class="secondary">Add</button>
    </form>
  </section>

  <!-- Settle up -->
  <section class="panel">
    <h2>Settle up</h2>
    <div id="settle"></div>
  </section>

  <!-- Log -->
  <section class="panel">
    <div class="row" style="margin-bottom:8px">
      <h2 style="margin:0">History</h2>
      <span class="spacer"></span>
      <button id="undo" class="secondary">↶ Undo</button>
    </div>
    <ol class="log" id="log" reversed></ol>
  </section>

  <!-- Settings -->
  <section class="panel">
    <h2>Settings</h2>
    <div class="row">
      <label for="ante-amt">Ante $</label>
      <input type="number" id="ante-amt" min="1" step="1">
      <label for="pen-amt">Off-table $</label>
      <input type="number" id="pen-amt" min="1" step="1">
    </div>
    <div class="row" style="margin-top:14px">
      <button id="reset" class="danger">End game &amp; start over</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script>
(() => {
  const STORE_KEY = 'dice-pot-tracker-v1';
  const $ = (id) => document.getElementById(id);

  let state = load() || freshState();
  let history = [];   // snapshots for undo (this session only)

  function freshState() {
    return {
      players: [],     // { id, name, paid, won }
      pot: 0,
      round: 0,
      ante: 1,
      penalty: 1,
      log: [],
      nextId: 1,
    };
  }

  function save() {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  function load() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { return null; }
  }

  const money = (n) => (n < 0 ? '-$' : '$') + Math.abs(n);
  const net = (p) => p.won - p.paid;

  // Every change goes through here so it can be undone.
  function act(msg, fn) {
    history.push(JSON.stringify(state));
    history = history.slice(-100);
    fn();
    state.log.unshift(msg);
    state.log = state.log.slice(0, 300);
    render();
    toast(msg);
  }

  function undo() {
    if (!history.length) return;
    const undone = state.log[0];
    state = JSON.parse(history.pop());
    render();
    toast('Undid: ' + undone);
  }

  let toastTimer;
  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
  }

  // ---------- Actions ----------

  function anteUp() {
    if (!state.players.length) return;
    const carried = state.pot;
    act(`Round ${state.round + 1}: everyone antes ${money(state.ante)}.` + (carried ? ` (${money(carried)} carried over)` : ''), () => {
      state.round += 1;
      state.players.forEach((p) => { p.paid += state.ante; });
      state.pot += state.ante * state.players.length;
    });
  }

  function offTable(p) {
    act(`${p.name} rolled one off the table: +${money(state.penalty)} to the pot.`, () => {
      p.paid += state.penalty;
      state.pot += state.penalty;
    });
  }

  function wins(p) {
    if (!state.pot) return;
    act(`🏆 ${p.name} wins the ${money(state.pot)} pot.`, () => {
      p.won += state.pot;
      state.pot = 0;
    });
  }

  function carry() {
    if (!state.pot) return;
    act(`No winner: ${money(state.pot)} pot carries over.`, () => {});
  }

  function addPlayer(name) {
    act(`${name} joined.`, () => {
      state.players.push({ id: state.nextId++, name, paid: 0, won: 0 });
    });
  }

  function removePlayer(p) {
    const n = net(p);
    const msg = n
      ? `Remove ${p.name}? They're ${n < 0 ? 'down' : 'up'} ${money(Math.abs(n))}, which will drop out of Settle up.`
      : `Remove ${p.name}?`;
    if (!confirm(msg)) return;
    act(`${p.name} left (${n < 0 ? 'down' : 'up'} ${money(Math.abs(n))}).`, () => {
      state.players = state.players.filter((x) => x.id !== p.id);
    });
  }

  // Minimal list of payments that squares everyone up.
  // Money still in the pot isn't anyone's yet, so it's left out.
  function settlements() {
    const debtors = state.players.filter((p) => net(p) < 0).map((p) => ({ name: p.name, amt: -net(p) }));
    const creditors = state.players.filter((p) => net(p) > 0).map((p) => ({ name: p.name, amt: net(p) }));
    debtors.sort((a, b) => b.amt - a.amt);
    creditors.sort((a, b) => b.amt - a.amt);
    const out = [];
    let i = 0, j = 0;
    while (i < debtors.length && j < creditors.length) {
      const amt = Math.min(debtors[i].amt, creditors[j].amt);
      out.push({ from: debtors[i].name, to: creditors[j].name, amt });
      debtors[i].amt -= amt;
      creditors[j].amt -= amt;
      if (!debtors[i].amt) i++;
      if (!creditors[j].amt) j++;
    }
    return out;
  }

  // ---------- Rendering ----------

  function el(tag, props, ...kids) {
    const e = document.createElement(tag);
    Object.assign(e, props);
    kids.forEach((k) => e.append(k));
    return e;
  }

  function render() {
    $('pot').textContent = money(state.pot);
    $('pot-note').textContent = state.round
      ? `Round ${state.round} · ${state.players.length} player${state.players.length === 1 ? '' : 's'}`
      : state.players.length ? 'Tap "New round" to collect the first ante.' : 'Add players to get started.';
    $('ante').textContent = `New round: everyone antes ${money(state.ante)}`;
    $('ante').disabled = !state.players.length;
    $('carry').disabled = !state.pot;

    // Players
    const box = $('players');
    box.innerHTML = '';
    if (!state.players.length) box.append(el('p', { className: 'empty', textContent: 'No players yet.' }));
    state.players.forEach((p) => {
      const n = net(p);
      const netText = n < 0 ? `owes ${money(-n)}` : n > 0 ? `up ${money(n)}` : 'even';
      box.append(el('div', { className: 'player' },
        el('div', { className: 'top' },
          el('span', { className: 'name', textContent: p.name }),
          el('button', { className: 'link', textContent: '✕', title: `Remove ${p.name}`, onclick: () => removePlayer(p) }),
          el('span', { className: 'net ' + (n < 0 ? 'neg' : n > 0 ? 'pos' : 'even'), textContent: netText }),
        ),
        el('div', { className: 'detail', textContent: `Put in ${money(p.paid)} · Won ${money(p.won)}` }),
        el('div', { className: 'row' },
          el('button', { className: 'danger', textContent: `Off table +${money(state.penalty)}`, onclick: () => offTable(p) }),
          el('button', { textContent: `🏆 Won pot`, disabled: !state.pot, onclick: () => wins(p) }),
        ),
      ));
    });

    // Settle up
    const s = $('settle');
    s.innerHTML = '';
    const pays = settlements();
    if (!pays.length) {
      s.append(el('p', { className: 'empty', textContent: 'Nobody owes anybody yet.' }));
    } else {
      const ul = el('ul', { className: 'settle' });
      pays.forEach((x) => ul.append(el('li', {},
        `${x.from} pays ${x.to} `, el('span', { className: 'amt', textContent: money(x.amt) }))));
      s.append(ul);
    }
    if (state.pot) {
      s.append(el('p', { className: 'empty', textContent: `${money(state.pot)} is still in the pot. It's counted against whoever put it in until someone wins it.` }));
    }

    // Log
    const log = $('log');
    log.innerHTML = '';
    state.log.forEach((m) => log.append(el('li', { textContent: m })));
    $('undo').disabled = !history.length;

    $('ante-amt').value = state.ante;
    $('pen-amt').value = state.penalty;

    save();
  }

  // ---------- Events ----------

  $('add-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = $('new-name').value.trim();
    if (!name) return;
    $('new-name').value = '';
    addPlayer(name);
  });
  $('ante').onclick = anteUp;
  $('carry').onclick = carry;
  $('undo').onclick = undo;
  $('ante-amt').onchange = (e) => { state.ante = Math.max(1, Math.round(+e.target.value) || 1); render(); };
  $('pen-amt').onchange = (e) => { state.penalty = Math.max(1, Math.round(+e.target.value) || 1); render(); };
  $('reset').onclick = () => {
    if (!confirm('End this game and start over? The pot and everyone\'s totals will be cleared. Players are kept.')) return;
    act('New game started.', () => {
      const keep = state.players.map((p) => ({ ...p, paid: 0, won: 0 }));
      const { ante, penalty, nextId } = state;
      state = Object.assign(freshState(), { players: keep, ante, penalty, nextId });
    });
  };

  render();
})();
</script>
</body>
</html>
